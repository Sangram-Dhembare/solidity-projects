name: Solidity CI

on:
  push:
  pull_request:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test
